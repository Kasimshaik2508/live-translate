<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Live Translate</title>
<style>
  :root {
    --bg: #f7f7f5; --panel: #ffffff; --text: #1d1d1b; --muted: #6b6b66;
    --line: #e4e4df; --accent: #2457d6; --accent-text: #ffffff; --live: #d62f2f; --level: #2f9e5b;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #151514; --panel: #1f1f1d; --text: #ececea; --muted: #9a9a94;
      --line: #33332f; --accent: #6d93ff; --accent-text: #0d0d0c; --live: #ff6b6b; --level: #4cc27f;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--bg); color: var(--text);
    font: 16px/1.5 system-ui, -apple-system, "Segoe UI", sans-serif;
  }
  main { max-width: 860px; margin: 0 auto; padding: 24px 16px 48px; }
  h1 { font-size: 1.4rem; margin: 0 0 16px; }
  .controls { display: flex; flex-wrap: wrap; gap: 12px; align-items: end; margin-bottom: 16px; }
  label { display: flex; flex-direction: column; gap: 4px; font-size: .85rem; color: var(--muted); }
  .fixed { color: var(--text); font-size: 1rem; padding: 8px 0; }
  select, input[type=text] {
    font: inherit; color: var(--text); background: var(--panel);
    border: 1px solid var(--line); border-radius: 8px; padding: 8px 10px;
  }
  button {
    font: inherit; font-weight: 600; border: 0; border-radius: 8px; padding: 9px 18px;
    background: var(--accent); color: var(--accent-text); cursor: pointer;
  }
  button.secondary { background: transparent; color: var(--text); border: 1px solid var(--line); }
  button.live { background: var(--live); }
  .statusbar { display: flex; align-items: center; gap: 12px; margin-bottom: 12px; min-height: 1.5em; }
  #status { font-size: .9rem; color: var(--muted); }
  #status.live::before { content: "● "; color: var(--live); }
  .meter { width: 80px; height: 6px; border-radius: 3px; background: var(--line); overflow: hidden; }
  .meter[hidden] { display: none; }
  .meter > div { height: 100%; width: 0; background: var(--level); transition: width .08s linear; }
  #log { display: flex; flex-direction: column; gap: 10px; }
  .row {
    display: grid; grid-template-columns: 1fr 1fr; gap: 16px;
    background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 12px 14px;
  }
  .row .src { color: var(--muted); }
  .row .dst { font-weight: 500; }
  .row.interim .src { font-style: italic; }
  .row.interim .dst:empty::after { content: ""; }
  .row .dst:empty::after { content: "…"; color: var(--muted); }
  .tag {
    display: inline-block; margin-bottom: 4px; padding: 0 8px; border-radius: 999px;
    font-size: .75rem; color: var(--muted); border: 1px solid var(--line);
  }
  .tag:empty { display: none; }
  form.typed { display: flex; gap: 8px; margin-top: 20px; }
  form.typed input { flex: 1; }
  @media (max-width: 600px) {
    .row { grid-template-columns: 1fr; gap: 4px; }
  }
</style>
</head>
<body>
<main>
  <h1>Live Translate</h1>
  <div class="controls">
    <label>Mode
      <select id="mode">
        <option value="continuous">Continuous (fastest)</option>
        <option value="sentences">Sentence by sentence (most accurate)</option>
      </select>
    </label>
    <label>Translate to
      <select id="target"></select>
    </label>
    <button id="toggle">Start listening</button>
    <button id="clear" class="secondary">Clear</button>
  </div>
  <div class="statusbar">
    <div class="meter" id="meter" hidden title="Microphone level"><div></div></div>
    <div id="status"></div>
  </div>
  <div id="log"></div>
  <form class="typed" id="typed">
    <input type="text" id="typedText" placeholder="Or type something to translate">
    <button type="submit" class="secondary">Translate</button>
  </form>
</main>
<script>
const LANGS = [
  ["en-US", "English"], ["hi-IN", "Hindi"], ["es-ES", "Spanish"], ["fr-FR", "French"],
  ["de-DE", "German"], ["it-IT", "Italian"], ["pt-BR", "Portuguese"], ["nl-NL", "Dutch"],
  ["ru-RU", "Russian"], ["uk-UA", "Ukrainian"], ["pl-PL", "Polish"], ["tr-TR", "Turkish"],
  ["ar-SA", "Arabic"], ["ur-PK", "Urdu"], ["bn-BD", "Bengali"], ["zh-CN", "Chinese (Mandarin)"],
  ["ja-JP", "Japanese"], ["ko-KR", "Korean"], ["vi-VN", "Vietnamese"], ["id-ID", "Indonesian"],
  ["sw-KE", "Swahili"],
];
const $ = (id) => document.getElementById(id);
const targetName = () => LANGS.find(([c]) => c === $("target").value)[1];

for (const [code, name] of LANGS) $("target").add(new Option(name, code));
const saved = (k, d) => { try { return localStorage.getItem(k) || d; } catch { return d; } };
const save = (k, v) => { try { localStorage.setItem(k, v); } catch {} };
$("target").value = saved("target", "en-US");
if (!$("target").value) $("target").value = "en-US";
$("mode").value = saved("mode", "continuous");
if (!$("mode").value) $("mode").value = "continuous";

function setStatus(text, live = false) {
  $("status").textContent = text;
  $("status").classList.toggle("live", live);
}

function addRow(text, interim = false) {
  const row = document.createElement("div");
  row.className = "row" + (interim ? " interim" : "");
  row.innerHTML = '<div class="src"></div><div><span class="tag"></span><div class="dst"></div></div>';
  row.querySelector(".src").textContent = text;
  $("log").append(row);
  row.scrollIntoView({ block: "nearest", behavior: "smooth" });
  return row;
}

// The model replies "<lang>Hindi + English</lang>translation"; split that as it streams in.
function parseReply(raw) {
  const open = "<lang>", close = "</lang>";
  if (raw.startsWith(open)) {
    const end = raw.indexOf(close);
    if (end === -1) return { lang: "", text: "" };  // tag still arriving
    return { lang: raw.slice(open.length, end).trim(), text: raw.slice(end + close.length).trimStart() };
  }
  if (open.startsWith(raw)) return { lang: "", text: "" };  // first few characters of the tag
  return { lang: "", text: raw };  // error message, or the model skipped the tag
}

function showReply(row, raw) {
  const reply = parseReply(raw);
  row.querySelector(".tag").textContent = reply.lang;
  row.querySelector(".dst").textContent = reply.text;
  return reply;
}

// --- Typed text: one request per line, with recent lines as context ---
const typedHistory = [];

async function translateTyped(text, row) {
  const res = await fetch("/api/translate", {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({
      text, source_lang: "auto-detect", target_lang: targetName(), history: typedHistory.slice(-6),
    }),
  });
  if (!res.ok) { row.querySelector(".dst").textContent = `[error: server returned ${res.status}]`; return; }
  const reader = res.body.getReader();
  const decoder = new TextDecoder();
  let raw = "", reply;
  for (;;) {
    const { value, done } = await reader.read();
    if (done) break;
    raw += decoder.decode(value, { stream: true });
    reply = showReply(row, raw);
  }
  if (reply && !reply.text.startsWith("[error")) typedHistory.push({ source: text, translation: reply.text });
}

// --- Live listening: stream 16 kHz 16-bit mono PCM to the server in 100 ms chunks ---
const WORKLET = `
class Pcm16 extends AudioWorkletProcessor {
  constructor() { super(); this.buf = new Int16Array(1600); this.n = 0; this.peak = 0; }
  process(inputs) {
    const ch = inputs[0][0];
    if (ch) for (let i = 0; i < ch.length; i++) {
      const s = Math.max(-1, Math.min(1, ch[i]));
      if (Math.abs(s) > this.peak) this.peak = Math.abs(s);
      this.buf[this.n++] = s < 0 ? s * 0x8000 : s * 0x7fff;
      if (this.n === this.buf.length) {
        this.port.postMessage({ pcm: this.buf.buffer, peak: this.peak }, [this.buf.buffer]);
        this.buf = new Int16Array(1600); this.n = 0; this.peak = 0;
      }
    }
    return true;
  }
}
registerProcessor("pcm16", Pcm16);`;

let listening = false;
let mic = null, audioCtx = null, socket = null, interimRow = null, lastError = "";
const rows = new Map();

// Continuous mode: heard and translated words arrive as separate streams of fragments.
// A pause starts a new line; translations fill lines in order, moving to the next line
// once the current one's translation ends a sentence or goes quiet.
const PAUSE_MS = 1500;
const live = { lines: [], heardAt: 0, outIndex: 0, outAt: 0 };
const endsSentence = (text) => /[.?!।]\s*$/.test(text);

function appendText(el, fragment) {
  el.textContent = (el.textContent + fragment).replace(/^\s+/, "");
}

function onHeard(fragment) {
  const now = Date.now();
  let line = live.lines.at(-1);
  const src = line?.querySelector(".src").textContent ?? "";
  const longSentence = src.length > 160 && endsSentence(src);
  if (!line || now - live.heardAt > PAUSE_MS || longSentence) {
    line = addRow("");
    live.lines.push(line);
  }
  live.heardAt = now;
  appendText(line.querySelector(".src"), fragment);
}

function onTranslated(fragment) {
  const now = Date.now();
  if (!live.lines.length) live.lines.push(addRow(""));
  let line = live.lines[live.outIndex];
  const dst = line.querySelector(".dst").textContent;
  const hasNewer = live.outIndex < live.lines.length - 1;
  if (hasNewer && dst && (endsSentence(dst) || now - live.outAt > PAUSE_MS)) {
    live.outIndex += 1;
    line = live.lines[live.outIndex];
  }
  live.outAt = now;
  appendText(line.querySelector(".dst"), fragment);
  line.scrollIntoView({ block: "nearest", behavior: "smooth" });
}

function handleMessage(msg) {
  if (msg.type === "status") {
    setStatus("Listening… speak in Hindi, English or both", true);
  } else if (msg.type === "heard") {
    onHeard(msg.text);
  } else if (msg.type === "translated") {
    onTranslated(msg.text);
  } else if (msg.type === "interim") {
    if (!interimRow) interimRow = addRow("", true);
    interimRow.querySelector(".src").textContent = msg.text;
  } else if (msg.type === "final") {
    if (interimRow) { interimRow.remove(); interimRow = null; }
    rows.set(msg.id, addRow(msg.text));
  } else if (msg.type === "translation") {
    const row = rows.get(msg.id);
    if (row) showReply(row, msg.text);
  } else if (msg.type === "error") {
    lastError = msg.text;
    setStatus(`Error: ${msg.text}`, listening);
  }
}

async function startListening() {
  lastError = "";
  setStatus("Starting…");
  try {
    mic = await navigator.mediaDevices.getUserMedia({
      audio: { channelCount: 1, echoCancellation: false, noiseSuppression: true, autoGainControl: true },
    });
  } catch {
    setStatus("Microphone access was blocked. Allow it for this site and try again.");
    return;
  }
  listening = true;
  $("toggle").textContent = "Stop";
  $("toggle").classList.add("live");
  $("meter").hidden = false;

  // The browser resamples the microphone to 16 kHz for us.
  audioCtx = new AudioContext({ sampleRate: 16000 });
  const url = URL.createObjectURL(new Blob([WORKLET], { type: "application/javascript" }));
  await audioCtx.audioWorklet.addModule(url);
  const worklet = new AudioWorkletNode(audioCtx, "pcm16");
  audioCtx.createMediaStreamSource(mic).connect(worklet);
  worklet.connect(audioCtx.destination);  // outputs silence; keeps the node running

  const proto = location.protocol === "https:" ? "wss" : "ws";
  live.lines = []; live.outIndex = 0;
  const params = new URLSearchParams({
    target: targetName(), target_code: $("target").value.split("-")[0], mode: $("mode").value,
  });
  socket = new WebSocket(`${proto}://${location.host}/ws?${params}`);
  socket.binaryType = "arraybuffer";
  const pending = [];  // audio captured while the connection opens
  socket.onopen = () => { for (const chunk of pending.splice(0)) socket.send(chunk); };
  socket.onmessage = (event) => handleMessage(JSON.parse(event.data));
  socket.onclose = () => {
    if (!listening) return;
    stopListening();
    setStatus(lastError ? `Error: ${lastError}` : "Connection closed. Press Start listening again.");
  };
  worklet.port.onmessage = ({ data }) => {
    $("meter").firstElementChild.style.width = `${Math.min(100, data.peak * 140)}%`;
    if (socket.readyState === WebSocket.OPEN) socket.send(data.pcm);
    else if (socket.readyState === WebSocket.CONNECTING) pending.push(data.pcm);
  };
}

function stopListening() {
  listening = false;
  if (socket) socket.close();
  if (mic) mic.getTracks().forEach((t) => t.stop());
  if (audioCtx) audioCtx.close();
  socket = mic = audioCtx = null;
  if (interimRow) { interimRow.remove(); interimRow = null; }
  $("toggle").textContent = "Start listening";
  $("toggle").classList.remove("live");
  $("meter").hidden = true;
  setStatus("Stopped.");
}

if (!navigator.mediaDevices?.getUserMedia || !window.AudioWorkletNode) {
  $("toggle").disabled = true;
  setStatus("This browser can't record audio here. Use a current Chrome, Edge or Safari, or type below.");
}

$("toggle").onclick = () => (listening ? stopListening() : startListening());
$("clear").onclick = () => {
  $("log").replaceChildren();
  rows.clear(); interimRow = null; typedHistory.length = 0;
  live.lines = []; live.outIndex = 0;
};
for (const id of ["target", "mode"]) {
  $(id).onchange = () => {
    save(id, $(id).value);
    if (listening) { stopListening(); startListening(); }
  };
}
$("typed").onsubmit = (e) => {
  e.preventDefault();
  const text = $("typedText").value.trim();
  if (!text) return;
  $("typedText").value = "";
  translateTyped(text, addRow(text));
};
</script>
</body>
</html>
